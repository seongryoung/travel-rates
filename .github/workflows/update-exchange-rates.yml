name: Update Exchange Rates

permissions:
  contents: write

on:
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:

concurrency:
  group: update-exchange-rates
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Fetch exchange rates
        run: |
          curl --fail --silent --show-error --location \
            "https://v6.exchangerate-api.com/v6/${API_KEY}/latest/USD" \
            -o raw.json
        env:
          API_KEY: ${{ secrets.EXCHANGE_API_KEY }}

      - name: Transform JSON
        run: |
          jq -e '
            if .result != "success" then
              error("ExchangeRate-API error: " + (."error-type" // "unknown"))
            else
              {
                base: .base_code,
                date: (.time_last_update_unix | strftime("%Y-%m-%d %H:%M")),
                rates: (.conversion_rates | del(.USD))
              }
            end
          ' raw.json > rates.json

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add rates.json

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Exchange rate update"
            git push
          fi

      - name: Purge jsDelivr CDN cache
        run: |
          curl --fail --silent --show-error -X GET \
            "https://purge.jsdelivr.net/gh/seongryoung/travel-rates@main/rates.json"
